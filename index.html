<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable Google Translate & Browser Auto-Translation Prompt in Installed PWA -->
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <link rel="icon" type="image/png" href="/images/hiet_crest.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f2942" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HIET GROUP OF INSTITUTIONS - Digital Campus Portal, Vidyanagar, Shahpur, Distt. Kangra (H.P.)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>HIET GROUP OF INSTITUTIONS • HIET Digital Campus</title>
    <script>
      (function () {
        try {
          localStorage.removeItem("hiet-digital-campus-theme");
          localStorage.removeItem("hiet_theme_mode");
        } catch (e) {}
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        document.documentElement.style.colorScheme = "light";
      })();
    </script>
  </head>
  <body class="notranslate bg-[#f8fafc] min-h-screen text-slate-800 antialiased selection:bg-[#0f2942] selection:text-white" translate="no">
    <div id="root" class="notranslate" translate="no">
      <!-- Institutional Startup Splash Screen (Visible while React & scripts initialize) -->
      <div id="hiet-app-boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#f8fafc;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;z-index:99999;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;max-width:380px;">
          <!-- Logo Emblem Card with clean institutional styling and zero black distortion -->
          <div style="width:88px;height:88px;border-radius:24px;background:#ffffff;box-shadow:0 12px 30px -4px rgba(15,41,66,0.12),0 4px 6px -2px rgba(15,41,66,0.05);display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:20px;border:1px solid #e2e8f0;">
            <img src="/images/hiet_crest.png" alt="HIET Emblem" style="width:100%;height:100%;object-fit:contain;" />
          </div>
          <h1 style="font-size:16px;font-weight:800;color:#0f2942;margin:0 0 6px 0;letter-spacing:-0.02em;">HIET GROUP OF INSTITUTIONS</h1>
          <p style="font-size:12px;font-weight:600;color:#64748b;margin:0 0 24px 0;">Digital Campus Portal • Shahpur (H.P.)</p>
          <!-- Smooth Institutional Progress Shimmer -->
          <div style="width:160px;height:4px;background:#e2e8f0;border-radius:9999px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:#0f2942;border-radius:9999px;animation:hiet-shimmer 1.5s ease-in-out infinite;"></div>
          </div>
          <p style="font-size:11px;font-weight:500;color:#94a3b8;margin-top:14px;">Loading workspace...</p>
          <style>
            @keyframes hiet-shimmer {
              0% { left: -50%; width: 50%; }
              50% { left: 25%; width: 60%; }
              100% { left: 100%; width: 50%; }
            }
          </style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
